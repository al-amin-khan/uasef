[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uasef"
version = "0.1.0"
description = "Universal AI Software Engineering Framework: portable agent skills and auditable project inception"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "UASEF Contributors"}]
dependencies = []

[project.scripts]
uasef = "uasef.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
