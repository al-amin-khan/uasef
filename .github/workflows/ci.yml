name: UASEF tests
on:
  push:
  pull_request:
jobs:
  live-git-tools:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Install pinned Git tools
        run: python scripts/install_ci_git_tools.py
      - name: Live Git hook and memory integration
        run: python scripts/live_git_tools.py
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
